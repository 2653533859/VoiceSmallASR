name: Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_full_e2e:
        description: "下载/恢复模型并运行 Windows 完整模型 e2e（首次可能需要较长时间）"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze Flutter project
        working-directory: app
        run: flutter analyze

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Install FFmpeg for desktop e2e
        shell: pwsh
        run: choco install ffmpeg --no-progress --yes

      - name: Build Windows Release and installer
        shell: pwsh
        run: ./scripts/build_windows_unsigned.ps1 -Flutter flutter

      - name: Restore Windows e2e model cache
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_e2e == true }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/voicesmallasr-models
          key: windows-e2e-model-${{ runner.os }}-2024-07-17-v1

      - name: Install 7-Zip for Windows full model e2e
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_e2e == true }}
        shell: pwsh
        run: choco install 7zip --no-progress --yes

      - name: Prepare Windows full e2e model and media
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_e2e == true }}
        shell: pwsh
        run: ./scripts/prepare_windows_e2e.ps1 -ModelRoot "${{ runner.temp }}\voicesmallasr-models"

      - name: Run Windows full model e2e
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_e2e == true }}
        working-directory: app
        shell: pwsh
        env:
          VSASR_MODEL_DIR: '${{ runner.temp }}/voicesmallasr-models'
        run: flutter test integration_test/e2e_test.dart -d windows

      - name: Prepare Windows desktop smoke media
        shell: pwsh
        run: |
          $smokeDir = Join-Path $env:RUNNER_TEMP "voicesmallasr-windows-smoke"
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          $audio = Join-Path $smokeDir "tone.m4a"
          $video = Join-Path $smokeDir "tone.mp4"
          & ffmpeg @("-y", "-f", "lavfi", "-i", "sine=frequency=440:duration=2", "-c:a", "aac", "-b:a", "128k", $audio)
          if ($LASTEXITCODE -ne 0) { throw "生成 tone.m4a 失败，退出码 $LASTEXITCODE" }
          & ffmpeg @("-y", "-f", "lavfi", "-i", "color=c=black:s=640x360:r=30:d=2", "-f", "lavfi", "-i", "sine=frequency=440:duration=2", "-c:v", "libx264", "-pix_fmt", "yuv420p", "-c:a", "aac", "-b:a", "128k", "-shortest", $video)
          if ($LASTEXITCODE -ne 0) { throw "生成 tone.mp4 失败，退出码 $LASTEXITCODE" }

      - name: Run Windows desktop smoke
        working-directory: app
        shell: pwsh
        env:
          VSASR_SMOKE_AUDIO: "${{ runner.temp }}/voicesmallasr-windows-smoke/tone.m4a"
          VSASR_SMOKE_VIDEO: "${{ runner.temp }}/voicesmallasr-windows-smoke/tone.mp4"
        run: flutter test integration_test/windows_smoke_test.dart -d windows

      - name: Verify artifacts
        shell: pwsh
        run: |
          $releaseDir = "${{ github.workspace }}\app\build\windows\x64\runner\Release"
          $exe = Join-Path $releaseDir "vsasr_app.exe"
          $installer = "${{ github.workspace }}\dist\windows\VoiceSmallASR-unsigned-setup.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "缺少 Windows 可执行文件：$exe" }
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "缺少 Windows 安装包：$installer" }

          $requiredFiles = @(
            "flutter_windows.dll",
            "libmpv-2.dll",
            "onnxruntime.dll",
            "sherpa-onnx-c-api.dll"
          )
          foreach ($requiredFile in $requiredFiles) {
            $path = Join-Path $releaseDir $requiredFile
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "缺少 Windows 运行时依赖：$path"
            }
          }

          $forbiddenFiles = Get-ChildItem -LiteralPath $releaseDir -Recurse -File |
            Where-Object {
              $_.Name -match '(?i)(\.onnx|\.tar|\.bz2)$' -or $_.Name -ieq "tokens.txt"
            }
          if ($forbiddenFiles) {
            $paths = ($forbiddenFiles | ForEach-Object { $_.FullName }) -join "; "
            throw "Windows Release 误包含模型文件：$paths"
          }

          Get-Item -LiteralPath $exe, $installer | Select-Object FullName, Length
          Write-Host "Windows Release 产物检查通过：运行时依赖齐全且未包含模型文件"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoiceSmallASR-windows-release
          if-no-files-found: error
          path: |
            app/build/windows/x64/runner/Release/**
            dist/windows/VoiceSmallASR-unsigned-setup.exe
