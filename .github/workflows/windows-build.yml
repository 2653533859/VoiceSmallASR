name: Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze Flutter project
        working-directory: app
        run: flutter analyze

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows Release and installer
        shell: pwsh
        run: ./scripts/build_windows_unsigned.ps1 -Flutter flutter

      - name: Verify artifacts
        shell: pwsh
        run: |
          $releaseDir = "${{ github.workspace }}\app\build\windows\x64\runner\Release"
          $exe = Join-Path $releaseDir "vsasr_app.exe"
          $installer = "${{ github.workspace }}\dist\windows\VoiceSmallASR-unsigned-setup.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "缺少 Windows 可执行文件：$exe" }
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "缺少 Windows 安装包：$installer" }
          Get-Item -LiteralPath $exe, $installer | Select-Object FullName, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoiceSmallASR-windows-release
          if-no-files-found: error
          path: |
            app/build/windows/x64/runner/Release/**
            dist/windows/VoiceSmallASR-unsigned-setup.exe
