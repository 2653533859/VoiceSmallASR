name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要创建或更新的 Release tag，例如 v1.0.2"
        required: true
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.0"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Check release version
        shell: bash
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          app_version="$(sed -n 's/^version: \([0-9][0-9.]*\).*/\1/p' app/pubspec.yaml | head -n 1)"
          test "$release_version" = "$app_version"

      - name: Run Python checks
        run: |
          uv sync --locked
          uv run pytest
          uv run ruff check .

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Run Flutter checks
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test --no-pub

  android:
    name: Android APK and AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Build personal-use APK and AAB
        working-directory: app
        run: |
          release_version="${RELEASE_TAG#v}"
          flutter build apk --release --build-name "$release_version" --build-number "$GITHUB_RUN_NUMBER"
          flutter build appbundle --release --build-name "$release_version" --build-number "$GITHUB_RUN_NUMBER"
          mkdir -p dist/android
          cp build/app/outputs/apk/release/app-release.apk "dist/android/VoiceSmallASR-${RELEASE_TAG}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/android/VoiceSmallASR-${RELEASE_TAG}-android.aab"

      - name: Verify Android release assets
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK is not configured}}"
          build_tools_dir="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools_dir/apksigner" verify --verbose "dist/android/VoiceSmallASR-${RELEASE_TAG}-android.apk"
          for asset in \
            "dist/android/VoiceSmallASR-${RELEASE_TAG}-android.apk" \
            "dist/android/VoiceSmallASR-${RELEASE_TAG}-android.aab"; do
            if unzip -l "$asset" | grep -Eiq '\.(onnx|tar|bz2)$|tokens\.txt'; then
              echo "Android asset contains model files: $asset" >&2
              exit 1
            fi
          done
          test -s "dist/android/VoiceSmallASR-${RELEASE_TAG}-android.aab"

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and cold-start release APK on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash scripts/android_apk_install_smoke.sh app/dist/android/VoiceSmallASR-${RELEASE_TAG}-android.apk

      - name: Upload Android release assets
        uses: actions/upload-artifact@v7
        with:
          name: voicesmallasr-release-android
          if-no-files-found: error
          path: app/dist/android/*

  macos:
    name: macOS unsigned app and DMG
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build personal-use macOS app and DMG
        run: |
          BUILD_NAME="${RELEASE_TAG#v}" BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            FLUTTER_BIN="$(command -v flutter)" ./scripts/build_macos_unsigned.sh
          ditto -c -k --sequesterRsrc --keepParent \
            dist/macos/VoiceSmallASR.app \
            "dist/macos/VoiceSmallASR-${RELEASE_TAG}-macos-unsigned.zip"
          cp dist/macos/VoiceSmallASR-unsigned.dmg \
            "dist/macos/VoiceSmallASR-${RELEASE_TAG}-macos-unsigned.dmg"
          ./scripts/verify_model_exclusion.sh dist/macos/VoiceSmallASR.app
          if unzip -l "dist/macos/VoiceSmallASR-${RELEASE_TAG}-macos-unsigned.zip" | grep -Eiq '\.(onnx|tar|bz2)$|tokens\.txt'; then
            echo "macOS ZIP contains model files" >&2
            exit 1
          fi
          mount_point="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly \
            -mountpoint "$mount_point" \
            "dist/macos/VoiceSmallASR-${RELEASE_TAG}-macos-unsigned.dmg" >/dev/null
          trap 'hdiutil detach "$mount_point" >/dev/null 2>&1 || true' EXIT
          ./scripts/verify_model_exclusion.sh "$mount_point"
          hdiutil imageinfo "dist/macos/VoiceSmallASR-${RELEASE_TAG}-macos-unsigned.dmg" >/dev/null

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v7
        with:
          name: voicesmallasr-release-macos
          if-no-files-found: error
          path: dist/macos/*-macos-unsigned.*

  windows:
    name: Windows unsigned installer
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build personal-use Windows installer
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          ./scripts/build_windows_unsigned.ps1 -Flutter flutter -BuildName $version
          $asset = "dist\windows\VoiceSmallASR-$env:RELEASE_TAG-windows-unsigned-setup.exe"
          Copy-Item "dist\windows\VoiceSmallASR-unsigned-setup.exe" $asset

      - name: Verify Windows release asset
        shell: pwsh
        run: |
          $releaseDir = "${{ github.workspace }}\app\build\windows\x64\runner\Release"
          $exe = Join-Path $releaseDir "vsasr_app.exe"
          $installer = "${{ github.workspace }}\dist\windows\VoiceSmallASR-$env:RELEASE_TAG-windows-unsigned-setup.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "缺少 Windows 可执行文件：$exe" }
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "缺少 Windows 安装包：$installer" }
          if ((Get-Item -LiteralPath $installer).Length -le 0) { throw "Windows 安装包为空：$installer" }
          $modelFiles = Get-ChildItem -LiteralPath $releaseDir -Recurse -File | Where-Object { $_.Name -match '(?i)(\.onnx$|^tokens\.txt$|\.tar\.bz2$)' }
          if ($modelFiles) {
            throw "Windows 应用目录包含不应打包的模型文件：$($modelFiles.FullName -join ', ')"
          }

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v7
        with:
          name: voicesmallasr-release-windows
          if-no-files-found: error
          path: dist/windows/*-windows-unsigned-setup.exe

  release:
    name: Create GitHub Release
    needs: [quality, android, macos, windows]
    runs-on: ubuntu-24.04

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: voicesmallasr-release-*
          path: dist/release
          merge-multiple: true

      - name: Verify release asset set
        shell: bash
        run: |
          set -euo pipefail
          find dist/release -maxdepth 1 -type f -print
          test -s "dist/release/VoiceSmallASR-${RELEASE_TAG}-android.apk"
          test -s "dist/release/VoiceSmallASR-${RELEASE_TAG}-android.aab"
          test -s "dist/release/VoiceSmallASR-${RELEASE_TAG}-macos-unsigned.dmg"
          test -s "dist/release/VoiceSmallASR-${RELEASE_TAG}-macos-unsigned.zip"
          test -s "dist/release/VoiceSmallASR-${RELEASE_TAG}-windows-unsigned-setup.exe"

      - name: Generate checksums and build information
        shell: bash
        run: |
          set -euo pipefail
          cd dist/release
          sha256sum VoiceSmallASR-${RELEASE_TAG}-* > SHA256SUMS.txt
          cat > BUILD_INFO.txt <<EOF
          VoiceSmallASR release: ${RELEASE_TAG}
          Commit: ${GITHUB_SHA}
          Workflow: ${GITHUB_WORKFLOW}
          Run ID: ${GITHUB_RUN_ID}
          Run number: ${GITHUB_RUN_NUMBER}
          Built at (UTC): $(date -u '+%Y-%m-%dT%H:%M:%SZ')
          Signing: unsigned/personal use; Android uses debug signing
          Model files: excluded from all release application packages
          EOF
          test -s SHA256SUMS.txt
          test -s BUILD_INFO.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "VoiceSmallASR $RELEASE_TAG" \
              --notes "个人使用版本：Android debug-signed APK/AAB、Windows 未签名安装包、macOS 未签名 DMG/APP 压缩包。"
          fi
          gh release upload "$RELEASE_TAG" \
            dist/release/VoiceSmallASR-${RELEASE_TAG}-android.apk \
            dist/release/VoiceSmallASR-${RELEASE_TAG}-android.aab \
            dist/release/VoiceSmallASR-${RELEASE_TAG}-macos-unsigned.dmg \
            dist/release/VoiceSmallASR-${RELEASE_TAG}-macos-unsigned.zip \
            dist/release/VoiceSmallASR-${RELEASE_TAG}-windows-unsigned-setup.exe \
            dist/release/SHA256SUMS.txt \
            dist/release/BUILD_INFO.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
